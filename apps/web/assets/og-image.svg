<?xml version="1.0" encoding="UTF-8"?>
<!--
	Social preview card (1200x630) for og:image / twitter:image.

	Regenerate the PNG after editing with `bun og-image` (apps/web) or:
	  rsvg-convert -w 1200 -h 630 assets/og-image.svg -o public/og-image.png

	Colours mirror the light-mode tokens in packages/core/src/theme/tokens.ts.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
			<path d="M56 0H0V56" fill="none" stroke="#e4e4e7" stroke-width="1" />
		</pattern>
		<radialGradient id="gridFade" cx="50%" cy="0%" r="75%">
			<stop offset="25%" stop-color="#ffffff" />
			<stop offset="80%" stop-color="#000000" />
		</radialGradient>
		<mask id="gridMask">
			<rect width="1200" height="630" fill="url(#gridFade)" />
		</mask>
		<radialGradient id="heroGlow" cx="50%" cy="0%" r="60%">
			<stop offset="0%" stop-color="#2563eb" stop-opacity="0.22" />
			<stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="#ffffff" />
	<rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)" />
	<ellipse cx="600" cy="-80" rx="760" ry="520" fill="url(#heroGlow)" />

	<image
		href="../public/landing/scorebrawl-logo.png"
		x="540"
		y="64"
		width="120"
		height="120"
	/>

	<g
		font-family="JetBrains Mono, monospace"
		font-weight="bold"
		font-size="58"
		letter-spacing="-1.5"
		text-anchor="middle"
	>
		<text x="600" y="292" fill="#09090b">Settle every rivalry.</text>
		<text x="600" y="368" fill="#2563eb">Keep the score.</text>
	</g>

	<rect x="335" y="416" width="530" height="54" rx="27" fill="#fafafa" stroke="#e4e4e7" />
	<text
		x="600"
		y="450"
		font-family="JetBrains Mono, monospace"
		font-size="21"
		fill="#71717a"
		text-anchor="middle"
	>
		Leagues · Seasons · ELO · Live sessions
	</text>

	<text
		x="600"
		y="556"
		font-family="JetBrains Mono, monospace"
		font-size="22"
		fill="#a1a1aa"
		letter-spacing="1"
		text-anchor="middle"
	>
		scorebrawl.com
	</text>
</svg>
