[project]
name = "tallyo"
version = "0.1.0"
description = "Voice-activated match recorder for ScoreBrawl"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.0",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
