name: Preview Environment

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to deploy a preview for (must be open)
        required: true
        type: number
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 🔎 Validate PR is open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          if ! pr_json=$(gh pr view "$PR_INPUT" --repo "$REPO" --json number,state,isDraft,headRefName 2>/dev/null); then
            echo "::error::Pull request #$PR_INPUT was not found in $REPO."
            exit 1
          fi

          pr_number=$(echo "$pr_json" | jq -r '.number')
          pr_state=$(echo "$pr_json" | jq -r '.state')
          pr_draft=$(echo "$pr_json" | jq -r '.isDraft')
          pr_branch=$(echo "$pr_json" | jq -r '.headRefName')

          if [ "$pr_state" != "OPEN" ]; then
            echo "::error::PR #$pr_number is $pr_state. A preview can only be created for an open PR (draft or ready for review)."
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "is_draft=$pr_draft" >> "$GITHUB_OUTPUT"
          echo "branch=$pr_branch" >> "$GITHUB_OUTPUT"
          echo "Validated open PR #$pr_number (branch: $pr_branch, draft: $pr_draft)"

      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: refs/pull/${{ steps.pr.outputs.pr_number }}/head

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun run build

      - name: 🗄️ Create D1 Database
        id: create-db
        run: bun run .github/scripts/preview/create-d1-db.ts
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔍 Get D1 Database ID
        id: get-db
        run: bun run .github/scripts/preview/get-d1-db-id.ts
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📦 Create R2 Buckets
        id: create-r2
        run: bun run .github/scripts/preview/create-r2-bucket.ts
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📨 Create Queue
        id: create-queue
        run: bun run .github/scripts/preview/create-queue.ts
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔄 Prepare wrangler config for preview
        id: prepare-config
        run: bun run .github/scripts/preview/prepare-wrangler-config.ts
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          DB_ID: ${{ steps.get-db.outputs.database_id }}
          DB_NAME: ${{ steps.get-db.outputs.database_name }}
          BUCKET_NAME: ${{ steps.create-r2.outputs.bucket_name }}
          ACHIEVEMENT_QUEUE_NAME: ${{ steps.create-queue.outputs.achievement_queue_name }}
          SEED_QUEUE_NAME: ${{ steps.create-queue.outputs.seed_queue_name }}

      - name: 🔄 Run Database Migrations
        run: |
          bun wrangler d1 migrations apply DB --remote --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🌱 Seed Database
        run: bun run db:seed:remote
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ steps.get-db.outputs.database_id }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 🔐 Set BETTER_AUTH_SECRET
        run: bun run .github/scripts/preview/set-better-auth-secret.ts
        env:
          WORKER_NAME: ${{ steps.prepare-config.outputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: 🔐 Set SEED_ALLOWED
        run: |
          printf "y\ntrue" | bun wrangler secret put SEED_ALLOWED --name ${{ steps.prepare-config.outputs.worker_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc --var VERSION:${{ github.sha }}

      - name: 📋 Summarize preview
        run: |
          {
            echo "## 🚀 Preview Environment Deployed"
            echo ""
            echo "- **Branch:** \`${{ steps.pr.outputs.branch }}\`"
            echo "- **PR:** #${{ steps.pr.outputs.pr_number }}"
            echo "- **Preview URL:** https://${{ steps.prepare-config.outputs.worker_name }}.coding-cowboys.workers.dev"
            echo "- **Database:** \`${{ steps.get-db.outputs.database_name }}\`"
            echo "- **R2 Bucket:** \`${{ steps.create-r2.outputs.bucket_name }}\`"
            echo "- **Queues:** \`${{ steps.create-queue.outputs.achievement_queue_name }}\`, \`${{ steps.create-queue.outputs.seed_queue_name }}\`"
            echo ""
            echo "**Test account:** \`seed@example.com\` / \`Test.1234\`"
            echo ""
            echo "This preview is cleaned up automatically when PR #${{ steps.pr.outputs.pr_number }} is closed."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔎 Check whether a preview exists for this branch
        id: check
        run: bun run .github/scripts/preview/preview-exists.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗑️ Remove Worker as Queue Consumer
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        run: bun run .github/scripts/preview/remove-queue-consumer.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗑️ Delete Worker
        if: steps.check.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name "scorebrawl-pr-${{ github.event.pull_request.number }}" --force

      - name: 🗑️ Delete Queue
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        run: bun run .github/scripts/preview/delete-queue.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗑️ Delete D1 Database
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        run: bun run .github/scripts/preview/delete-d1-db.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗑️ Delete R2 Buckets
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        run: bun run .github/scripts/preview/delete-r2-bucket.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 💬 Comment on PR
        if: steps.check.outputs.exists == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prNumber = context.issue.number;

            const comment = `## 🧹 Preview Environment Cleaned Up

            The preview environment, database, R2 bucket, and queue have been deleted.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
