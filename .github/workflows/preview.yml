name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_ENV: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔍 Check code quality
        run: bun check

      - name: 🧪 Run tests
        run: bun test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗄️ Create D1 Database
        id: get-db
        run: bun run .github/scripts/preview/create-database.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🪣 Create R2 Bucket
        id: create-r2
        run: bun run .github/scripts/preview/create-r2-bucket.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📨 Create Queue
        id: create-queue
        run: bun run .github/scripts/preview/create-queue.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔄 Prepare wrangler config for preview
        id: prepare-config
        run: bun run .github/scripts/preview/prepare-wrangler-config.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DB_ID: ${{ steps.get-db.outputs.database_id }}
          DB_NAME: ${{ steps.get-db.outputs.database_name }}
          BUCKET_NAME: ${{ steps.create-r2.outputs.bucket_name }}
          QUEUE_NAME: ${{ steps.create-queue.outputs.queue_name }}

      - name: 🔄 Run Database Migrations
        run: |
          bun wrangler d1 migrations apply DB --remote --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔐 Set BETTER_AUTH_SECRET
        run: bun run .github/scripts/preview/set-better-auth-secret.ts
        env:
          WORKER_NAME: ${{ steps.prepare-config.outputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: 🔐 Set AUTO_SEED_PREVIEW
        run: |
          echo "true" | bunx wrangler secret put AUTO_SEED_PREVIEW --name "${{ steps.prepare-config.outputs.worker_name }}" --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy Worker
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

      - name: 📋 Get preview URL
        id: get-url
        run: |
          PREVIEW_URL="https://${{ steps.prepare-config.outputs.worker_name }}.coding-cowboys.workers.dev"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

      - name: 🌱 Trigger Auto-Seed
        run: |
          # Ping the health endpoint to trigger auto-seed
          echo "Triggering auto-seed..."
          curl -s "${{ steps.get-url.outputs.preview_url }}/api/health" | jq .
          echo ""
          echo "Auto-seed triggered. Database will be seeded if empty."
          echo "Monitor with: bunx wrangler tail"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = '${{ steps.get-url.outputs.preview_url }}';
            const dbName = '${{ steps.get-db.outputs.database_name }}';
            const bucketName = '${{ steps.create-r2.outputs.bucket_name }}';
            const queueName = '${{ steps.create-queue.outputs.queue_name }}';

            const comment = `## 🚀 Preview Environment Deployed

            **Preview URL:** <a href="${previewUrl}" target="_blank">${previewUrl}</a>
            **Database:** \`${dbName}\`
            **R2 Buckets:** \`${bucketName}\`
            **Queue:** \`${queueName}\`

            **Test Account:**
            - Email: \`seed@scorebrawl.com\`
            - Password: \`Test.1234\`

            This preview environment will be automatically cleaned up when the PR is closed.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Environment Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }
