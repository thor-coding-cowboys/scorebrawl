name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to main.
        required: false
        type: string
        default: main

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: bun install

      - name: 🚀 Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # Blacksmith provides a transparent cache; the action's own CLI
          # cache is redundant and intermittently fails (400 / cache outage).
          eas-cache: false
          expo-cache: false

      - name: 📱 Build iOS
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive

      - name: 🚀 Submit to TestFlight
        working-directory: apps/mobile
        run: |
          superseded=$(eas workflow:runs --workflow submit-ios.yaml --status IN_PROGRESS --json | jq -r '.[].id')
          if [ -n "$superseded" ]; then
            echo "Cancelling superseded submissions:"
            echo "$superseded"
            eas workflow:cancel $superseded --non-interactive || true
          fi
          for attempt in 1 2 3; do
            if eas submit --platform ios --profile production --latest --non-interactive --no-wait; then
              exit 0
            fi
            echo "Submit attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          exit 1
