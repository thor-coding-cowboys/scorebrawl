name: CI

on:
  push:

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      VITE_GITHUB_CLIENT_ID: Ov23liEHPLUdBgTj5Cxu # https://github.com/organizations/thor-coding-cowboys/settings/applications/3369260
      VITE_GOOGLE_CLIENT_ID: 972190779505-ob8vi6970ib3c8i46plgmu4i9cpr7ohg.apps.googleusercontent.com
      VITE_DISABLE_EMAIL_PASSWORD: "true"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          fetch-depth: 0

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: ⚡ Setup Turbo cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: 💅 Format check
        run: bun run format

      - name: 🔍 Lint
        run: bun run lint

      - name: 🔎 Typecheck
        run: bun typecheck

      - name: 🧪 Test
        run: bun run test

      - name: 🏗️ Build
        run: bun run build

      - name: 🔍 Wrangler Typecheck
        run: bun run wrangler-typecheck

      - name: 🔁 Remap d1 migration names to nested layout
        if: github.ref == 'refs/heads/main'
        run: bunx wrangler d1 execute scorebrawl --remote --command "CREATE TABLE IF NOT EXISTS d1_migrations(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); UPDATE d1_migrations SET name = replace(substr(name, instr(name,'_')+1), '.sql', '/migration.sql') WHERE name NOT LIKE '%/%';"
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗄️ Apply database migrations
        if: github.ref == 'refs/heads/main'
        run: bun run db:migrate:prod
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        if: github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --var VERSION:${{ github.sha }}
